name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.20.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @lwill/database run validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/lwill_ci

      - name: Generate Prisma Client
        run: pnpm --filter @lwill/database run generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/lwill_ci

      - name: Typecheck authorization package
        run: pnpm --filter @lwill/authorization run typecheck

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Run production build
        run: pnpm build
